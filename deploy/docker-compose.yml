services:
  sara:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      SARA_API_TOKEN: ${SARA_API_TOKEN:?SARA_API_TOKEN is required}
      SARA_HOST: "0.0.0.0"
      SARA_PORT: "8090"
    ports:
      - "${SARA_PORT_EXTERNAL:-8090}:8090"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5

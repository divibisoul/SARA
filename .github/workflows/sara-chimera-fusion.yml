name: SARA Chimera fusion verification
on:
  push:
    branches:
      - "recovery/cycle3-sara-chimera-2026-09-28"
  pull_request:
    branches: [main]
    paths:
      - "src/sara/meta/octacore_mesh_fusion.py"
      - "src/sara/meta/aeternum_chimera.py"
      - "src/sara/meta/soul_federation.py"
      - "src/sara/meta/eru_runtime.py"
      - "src/sara/core/connected_runtime.py"
      - "src/sara/service/http_api.py"
      - "tests/test_octacore_mesh_fusion.py"
      - ".github/workflows/sara-chimera-fusion.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_octacore_mesh_fusion.py -q

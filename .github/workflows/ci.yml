name: SARA CI

concurrency:
  group: sara-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Forensic source self-check
        run: python scripts/forensic_self_check.py
      - name: Runtime self-check
        run: python scripts/sara_selfcheck.py
      - name: Full test suite
        run: python -m pytest -q

name: SOUL 25 Capability Upgrade - SARA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 25-repository augmentation contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('integrations/soul-25-augmentation.json'))
          assert d['external_provider_count'] == 25
          assert len(d['external_providers']) == 25
          assert d['soul_peer_count'] == 9
          assert len(d['soul_peers']) == 9
          assert d['native_authority'] == 'preserved'
          for p in d['external_providers']:
              assert p['id'] and p['capabilities']
              assert p.get('access', p.get('canonicalOwner'))
              assert p.get('structural_state', 'REAL') == 'REAL'
              assert p.get('runtime_state', p.get('state')) in {'PROJECTED','CATALOG_BOUND','ADAPTER_BOUND'}
              assert p.get('requires_adapter', True) is True
          print('SOUL-34 / 25-UPSTREAM AUGMENTATION CONTRACT: PASS')
          PY
      - name: Run Superpowers SARA agent test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test Superpowers SARA agent
        run: python -m pytest -q tests/test_superpowers_sara_agent.py

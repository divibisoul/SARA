name: SARA Bayesian runtime current

on:
  push:
    branches:
      - "feat/preserve-bayesian-runtime-current-2026-09-29"
  pull_request:
    branches: [main]
    paths:
      - "src/sara/meta/bayesian_uncertainty.py"
      - "src/sara/meta/eru_runtime.py"
      - "src/sara/meta/__init__.py"
      - "src/sara/__init__.py"
      - "tests/test_bayesian_runtime_parameters_current.py"
      - ".github/workflows/sara-bayesian-runtime-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Bayesian runtime tests
        run: python tests/test_bayesian_runtime_parameters_current.py

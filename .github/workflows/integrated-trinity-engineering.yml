name: Integrated Trinity engineering gate

on:
  push:
    branches: ["feat/integrated-trinity-engineering-gate"]
  pull_request:

permissions:
  contents: read

jobs:
  engineering-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Engineering gate
        run: python -m sara.audit.engineering_gate
      - name: Integrated regression tests
        run: |
          python -m pytest -q             tests/test_engineering_gate.py             tests/test_trinity_extended.py             tests/test_trinity_self_optimization.py             tests/test_integration.py             tests/test_runtime_diagnostics.py

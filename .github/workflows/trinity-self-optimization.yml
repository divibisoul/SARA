name: Trinity self-optimization validation

on:
  push:
    branches: ["feat/trinity-self-optimization"]
  pull_request:

permissions:
  contents: read

jobs:
  trinity-self-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SARA
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate additive Trinity layer
        run: |
          python -m pytest -q             tests/test_trinity_extended.py             tests/test_trinity_self_optimization.py

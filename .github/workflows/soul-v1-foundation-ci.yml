name: SOUL v1 foundation CI - SARA
on:
  push:
    branches: [restructure/soul-v1-regenerative-hooks-2026-10-06]
  pull_request:
    branches: [restructure/soul-v1-regenerative-hooks-2026-10-06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SARA
        run: python -m pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: NervoVago canonical alias
        run: pytest -q tests/test_nervo_vago_alias.py
